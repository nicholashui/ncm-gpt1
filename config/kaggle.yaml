# Kaggle T4 x2 training config (GPT-1-scale NCM, book-like data).
# Flex Attention is off (Turing / sm_75). Use chunked block-diagonal SDPA instead.
# Generator default is batch 4 per GPU with gradient checkpointing (effective 8
# on two T4s). Resume across 12-hour sessions. alpha=0.5 below is NOT the paper ELBO.
# Default corpus is an open BookCorpus recreation (GPT-1's domain); the
# orchestrator falls back if the Hub dataset is unavailable.
# GPT-1 scale Next-Concept Model (not a clone of 2018 GPT-1 weights).
# Transformer body matches GPT-1 (12 layers, d=768, 12 heads, d_ff=3072, context 512)
# but training is two-stage NCM: residual VQ-VAE tokenizer + coarse-to-fine generator.
#
# Paper / official OWT-style tokenizer (Table 5) scaled to L=512, codebook 4096 at
# every level. Generator flags follow official TinyStories / OWT eval configs.
name: kaggle
seed: 42

tokenizer:
  pre_tokenizer:
    name: hf
    tokenizer: hf
    model_id: gpt2
    special_tokens:
      eos_token: "<|endoftext|>"
      pad_token: "<|pad|>"
  vqvae:
    n_layers: 6          # attention head count in Encoder/Decoder, not depth
    embed_dim: 384
    in_vocab_size: 50304  # official OWT padding of gpt2 (+ pad) up to a multiple of 64
    context_length: 512
    compression_factor: 1
    dropout: 0.3
    pre_quant_groupnorm: 8
    use_qk_norm: true
    pre_quant_dropout: 0.0
    enc_layers: 0
    dec_layers: 1
    # 23 levels, codebook 4096 each (paper OWT Table 5, ending at L=512)
    vqvae_vocab_size:
      - 4096
      - 4096
      - 4096
      - 4096
      - 4096
      - 4096
      - 4096
      - 4096
      - 4096
      - 4096
      - 4096
      - 4096
      - 4096
      - 4096
      - 4096
      - 4096
      - 4096
      - 4096
      - 4096
      - 4096
      - 4096
      - 4096
      - 4096
    vector_quantizer_config:
      clss: multiscale_residual_vector_quantizer
      decay: 0.99
      epsilon: 1.0e-05
      commitment_cost: 0.25
      learned_l1_sampling: true
      learned_l1_cascade: true
      learned_l1_cascade_base: 4
      learned_all_sampling: false
      quant_resi:
        enabled: true
        ratio: 0.5
        share_mode: 0
        learnable_ratio: false
      aux:
        fine_drop:
          # Official implementation of nested dropout
          prob: 0.5
          min_keep: 1
        # Skip adding a residual where energy is already tiny (tokenizer training).
        spatial_skip:
          enabled: true
          min_level: 8
          energy_ratio: 0.2
          random_prob: 0.05
      levels:
        use_manual_levels: true
        # Perfect squares ending at 512 (23 levels)
        manual_levels: [1, 4, 9, 16, 25, 36, 49, 64, 81, 100, 121, 144, 169, 196, 225, 256, 289, 324, 361, 400, 441, 484, 512]
      learned_l1_cascade_norm: false
      learned_l1_cascade_norm_final: false
      ema_scale_by_world_size: false

model:
  n_layer: 12
  n_head: 12
  n_embd: 768
  bias: true
  dropout: 0.1
  context_length: 513     # prefix 1 + L, official pattern
  prefix_len: 1
  raw_token_prefix: true
  # gpt2 vocab is 50257 (ids 0-50256); adding <|pad|> gives 50258 tokens, pad id 50257.
  # in_vocab_size is padded to 50304 (multiple of 64). train_generator.py / generate.py
  # overwrite prefix_pad_token_id from the live tokenizer if special tokens shift it.
  prefix_pad_token_id: 50257
  # 22 heads (K-1). query_level0=false, predict_level0=false: level 0 is NOT
  # predicted by the transformer; it is sampled from a training unigram.
  vocab_size:
    - 4096
    - 4096
    - 4096
    - 4096
    - 4096
    - 4096
    - 4096
    - 4096
    - 4096
    - 4096
    - 4096
    - 4096
    - 4096
    - 4096
    - 4096
    - 4096
    - 4096
    - 4096
    - 4096
    - 4096
    - 4096
    - 4096
  predict_level0: false
  query_level0: false
  attn_pattern: block_diagonal
  use_positional_encoding: true
  use_level_encoding: true
  use_rope: true
  rope_base: 100000
  use_qk_norm: true
  ctx_encoder:
    enabled: false
    n_layer: 4
    vocab_size: 50304
  use_flex_attention: false
  # Chunked block-diagonal SDPA is the default when Flex is off (needed on T4).
  use_chunked_block_attn: true
  # Recompute each generator block; needed to fit seq ~4307 on a 16 GiB T4.
  gradient_checkpointing: true
  # Official OWT text models enable this residual conv after each upsample.
  post_upsample_conv:
    enabled: true
    kernel_size: 3
  # Tied codebook heads with a learned temperature; bias on, as in official OWT.
  tie_heads_to_codebook: true
  tie_heads_learn_scale: true
  tie_heads_bias: true

train:
  tokenizer:
    # Default 16 is tuned for a 16 GiB GPU (e.g. RTX 4070 Ti SUPER) with bf16.
    # If you OOM, pass --batch_size 8. The paper used much larger global batches.
    batch_size: 8
    peak_lr: 3.0e-4
    floor_lr: 3.0e-5
    warmup: 1000
    betas: [0.9, 0.95]
    weight_decay: 0.01
    grad_clip: 1.0
    max_steps: 100000
    save_every: 1000
    pack_repeat: 1
  generator:
    # v5 fit batch 2 with checkpointing (~3.3 GiB of 14.56 GiB). Batch 4
    # without checkpointing OOM'd on kernel v4. Checkpointing stays on;
    # default is now 4 per GPU. Try 8 only after a run shows 4 fits.
    # --batch_size still overrides this.
    batch_size: 4
    peak_lr: 3.0e-4
    floor_lr: 3.0e-5
    warmup: 500
    betas: [0.9, 0.95]
    weight_decay: 0.1
    grad_clip: 1.0
    max_steps: 100000
    save_every: 1000
    # DEPARTS FROM THE PAPER ELBO. alpha=0 weights every code position
    # equally, so the 512-cell level dominates and mid/coarse CE lagged in
    # v5 (~26% improvement vs ~77% on the finest level). alpha=0.5 shifts
    # weight onto shorter levels. gpt1.yaml / smoke.yaml stay at 0.
    # Resuming step 27595 with this value changes the loss mid-run.
    alpha: 0.5
    corrupt_p_max: 0.8    # linearly decreasing corruption, mean rate 0.50
    corrupt_p_min: 0.2
    pack_repeat: 1
    # Rank-0 forward-only tail. Batch 1: eval turns checkpointing off.
    val_every: 1000
    val_windows: 256
    val_batch_size: 1

generation:
  temperature: 1.0
  top_k: 0
  top_p: 1.0
  level0_unigram: generator.pt:inference.level0_unigram
  # Expand a later level only where the current decode is still uncertain.
  # Conservative defaults: always run the first 16 levels, always refine the
  # most uncertain 25% of cells, and never skip a cell that is not already sharp.
  adaptive:
    enabled: true
    early_stop: true
    spatial: true
    min_levels: 16
    spatial_after: 8
    token_conf_threshold: 0.92
    token_stable_threshold: 0.98
    spatial_conf_threshold: 0.97
    min_expand_frac: 0.25
    # Guided by the linguistic splitter when splitter.enabled is true.
    guide_expand: true
    unit: auto

# Split text first: sentence → phrase → word. Windows pack at sentence
# boundaries. Generation expands a cell only if the overlapping unit is uncertain.
# backend=rules works immediately and has no learned weights. Training still
# packs on sentence boundaries and writes artifacts/splitter/status.json so
# this is not a silent no-op. train_splitter.py can fit a tiny tagger, then
# set backend: model. guide_expand applies when generating.
splitter:
  enabled: true
  backend: rules
  ckpt: artifacts/splitter/splitter.pt
  pack_by_sentence: true
  guide_expand: true
  unit: auto

# Open BookCorpus recreation, streamed. v5 used max_windows 65536
# (~33.6M tokens) and the generator lapped that slice ~1.7 times.
# 524288 windows is 8× (~268M tokens). Rank 0 packs into an int32 buffer
# (~1 GiB); each rank then holds an int64 tensor (~2 GiB). Two processes
# stay well under Kaggle's ~29 GiB. The tensor is cached at
# artifacts/packed_windows.pt so a later resume with the same cap does not
# pack again. Other DDP ranks poll that file; they do not wait on an NCCL
# barrier (session v6 hit the 10-minute watchdog while rank 0 was still
# packing). The full BookCorpusOpen stream is not the default: packing
# it can spend a large part of a 12h session. Changing this cap on resume
# from step 27595 is intentional; checkpoints do not store the window order.
data:
  hf_dataset: lucadiliello/bookcorpusopen
  hf_split: train
  hf_text_field: text
  max_windows: 524288
