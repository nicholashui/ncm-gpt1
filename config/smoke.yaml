# CPU smoke config: tiny NCM, trainable in a few seconds. No HuggingFace download.
# Pre-tokenizer is a fixed ASCII char vocab (utils-free of the network).
name: smoke
seed: 42

tokenizer:
  pre_tokenizer:
    name: char
    pad_vocab_to: 128
  vqvae:
    n_layers: 4          # attention head count in Encoder/Decoder, not depth
    embed_dim: 32
    in_vocab_size: 128
    context_length: 16
    compression_factor: 1
    dropout: 0.1
    pre_quant_groupnorm: 8
    use_qk_norm: true
    pre_quant_dropout: 0.0
    enc_layers: 0
    dec_layers: 1
    vqvae_vocab_size: [64, 64, 64, 64]
    vector_quantizer_config:
      clss: multiscale_residual_vector_quantizer
      decay: 0.99
      epsilon: 1.0e-05
      commitment_cost: 0.25
      learned_l1_sampling: true
      learned_l1_cascade: true
      learned_l1_cascade_base: 4
      learned_all_sampling: false
      quant_resi:
        enabled: true
        ratio: 0.5
        share_mode: 0
        learnable_ratio: false
      aux:
        fine_drop:
          prob: 0.5
          min_keep: 1
      levels:
        use_manual_levels: true
        manual_levels: [1, 4, 8, 16]
      learned_l1_cascade_norm: false
      learned_l1_cascade_norm_final: false
      ema_scale_by_world_size: false

model:
  n_layer: 2
  n_head: 4
  n_embd: 32
  bias: true
  dropout: 0.1
  context_length: 17     # prefix 1 + L
  prefix_len: 1
  raw_token_prefix: true
  prefix_pad_token_id: 1  # CharTokenizer pad
  vocab_size: [64, 64, 64]  # K-1 heads; level 0 is not predicted
  predict_level0: false
  query_level0: false
  attn_pattern: block_diagonal
  use_positional_encoding: true
  use_level_encoding: true
  use_rope: true
  rope_base: 100000
  use_qk_norm: true
  ctx_encoder:
    enabled: false
  use_flex_attention: false
  post_upsample_conv:
    enabled: false
  tie_heads_to_codebook: false
  tie_heads_learn_scale: false

train:
  tokenizer:
    batch_size: 8
    peak_lr: 3.0e-4
    floor_lr: 3.0e-5
    warmup: 2
    betas: [0.9, 0.95]
    weight_decay: 0.01
    grad_clip: 1.0
    max_steps: 8
    save_every: 8
    # Repeat the tiny corpus so packed windows fill several batches.
    pack_repeat: 8
  generator:
    batch_size: 8
    peak_lr: 3.0e-4
    floor_lr: 3.0e-5
    warmup: 2
    betas: [0.9, 0.95]
    weight_decay: 0.1
    grad_clip: 1.0
    max_steps: 8
    save_every: 8
    alpha: 0.0
    corrupt_p_max: 0.8
    corrupt_p_min: 0.2
    pack_repeat: 8

generation:
  temperature: 1.0
  top_k: 0
  top_p: 1.0
  adaptive:
    enabled: false

splitter:
  enabled: true
  backend: rules
  pack_by_sentence: false
  guide_expand: false
  unit: auto
